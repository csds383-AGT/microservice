services:
  db:
    build: db
    environment:
      POSTGRES_USER: festhub
      POSTGRES_PASSWORD: festhub
      POSTGRES_DB: festhub
    ports:
      # ip:port on your machine : port inside the container
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "festhub"]
      interval: 2s
      retries: 15
    networks:
      - db_net

  logic:
    build:
      context: .
      dockerfile: logic/Dockerfile
    environment:
      DATABASE_URL: postgresql://festhub:festhub@db:5432/festhub
      # listen only on app_net (not db_net), and only answer calls from kong and the peer services
      BIND_ADDRESS: 172.30.83.20
      GATEWAY_IP: 172.30.83.30
      PEER_IPS: 172.30.83.50
      ARTISTS_HOST: artists
    networks:
      app_net:
        ipv4_address: 172.30.83.20
      db_net:
    depends_on:
      db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: logic
          target: /festhub/logic
        - action: sync+restart
          path: backend-server.py
          target: /festhub/backend-server.py
        - action: sync+restart
          path: common
          target: /festhub/common
        - action: rebuild
          path: concerts/concerts.proto
        - action: rebuild
          path: artists/artists.proto
        - action: rebuild
          path: categories/categories.proto
        - action: rebuild
          path: media/media.proto
        - action: rebuild
          path: requirements.txt

  artists-db:
    build: artists/db
    environment:
      POSTGRES_USER: artists
      POSTGRES_PASSWORD: artists
      POSTGRES_DB: artists
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - artists-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "artists"]
      interval: 2s
      retries: 15
    networks:
      - artists_db_net

  artists:
    build:
      context: .
      dockerfile: artists/Dockerfile
    environment:
      DATABASE_URL: postgresql://artists:artists@artists-db:5432/artists
      BIND_ADDRESS: 172.30.83.50
      GATEWAY_IP: 172.30.83.30
      PEER_IPS: 172.30.83.20
      CONCERTS_HOST: logic
    networks:
      app_net:
        ipv4_address: 172.30.83.50
      artists_db_net:
    depends_on:
      artists-db:
        condition: service_healthy
    develop:
      watch:
        - action: sync+restart
          path: artists/service.py
          target: /festhub/service.py
        - action: sync+restart
          path: artists/server.py
          target: /festhub/server.py
        - action: sync+restart
          path: common
          target: /festhub/common
        - action: rebuild
          path: concerts/concerts.proto
        - action: rebuild
          path: artists/artists.proto
        - action: rebuild
          path: categories/categories.proto
        - action: rebuild
          path: media/media.proto
        - action: rebuild
          path: requirements.txt

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    environment:
      BUSINESS_HOST: kong
      BUSINESS_PORT: "9080"
      FLASK_DEBUG: "1"
    networks:
      app_net:
        ipv4_address: 172.30.83.10
    depends_on:
      - logic
    develop:
      watch:
        - action: sync
          path: website.py
          target: /festhub/website.py
        - action: sync
          path: templates
          target: /festhub/templates
        - action: rebuild
          path: concerts/concerts.proto
        - action: rebuild
          path: artists/artists.proto
        - action: rebuild
          path: categories/categories.proto
        - action: rebuild
          path: media/media.proto
        - action: rebuild
          path: requirements.txt

  kong:
    build: kong
    environment:
      KONG_PROXY_LISTEN: "0.0.0.0:8000, 0.0.0.0:9080 http2"
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_NGINX_WORKER_PROCESSES: "1"
      KONG_ANONYMOUS_REPORTS: "off"
    ports:
      - "127.0.0.1:5001:8000"
      - "127.0.0.1:9080:9080"
    networks:
      app_net:
        ipv4_address: 172.30.83.30
    depends_on:
      - logic
      - artists
      - web
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 2s
      retries: 15
    develop:
      watch:
        - action: rebuild
          path: kong/kong.yml

networks:
  app_net:
    driver: bridge
    ipam:
      config:
        # fixed addresses, so each service can tell kong and its peers apart from anything else on this network
        - subnet: 172.30.83.0/24
          # containers without a fixed address get one from the upper half, so they can't take a fixed one
          ip_range: 172.30.83.128/25
  db_net:
    driver: bridge
  artists_db_net:
    driver: bridge

volumes:
  db-data:
  artists-db-data:
